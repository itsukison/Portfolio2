<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Itsuki Son | Tokyo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Space+Mono&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
            mono: ['Space Mono', 'monospace'],
          },
          colors: {
            'swiss-red': '#ff3b30',
            'off-white': '#f5f5f0',
            'deep-black': '#0a0a0a',
            'muted-grey': '#888888'
          }
        }
      }
    }
  </script>
  <style>
    body {
      cursor: crosshair;
    }

    /* Custom Scrollbar for that Swiss feel */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #f5f5f0;
    }

    ::-webkit-scrollbar-thumb {
      background: #000;
    }
  </style>

</head>

<body class="bg-off-white text-deep-black antialiased selection:bg-black selection:text-white">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
